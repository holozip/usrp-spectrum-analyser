<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B210 Spectrum</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101519; color: #ecf4f3; }
body { margin: 0; }
main { max-width: 1320px; margin: auto; padding: clamp(16px, 4vw, 56px); }
header, .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: -.045em; }
p { color: #a7babd; margin: 5px 0 0; }
#gain-control[hidden], #gain-stages[hidden], .capture-tools button[hidden] { display: none; }
#gain-control { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
#gain-control input { width: 110px; accent-color: #66dec5; }
#gain-control output { min-width: 3.4em; font-variant-numeric: tabular-nums; }
.gain-settings { align-self: center; }
#gain-stages { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 3px 8px 0; color: #a7babd; font-size: .78rem; }
#gain-stages span { white-space: nowrap; }
#gain-stages output { color: #ecf4f3; font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; }
button:disabled { opacity: .55; cursor: default; }
button { font: inherit; color: inherit; background: #243136; border: 1px solid #53676b; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
section { margin-top: 24px; border: 1px solid #35454a; border-radius: 14px; background: #171f23; overflow: hidden; }
.bar { padding: 14px 18px; border-bottom: 1px solid #35454a; font-size: .92rem; }
#peak-key { color: #f6b76b; }
#state { color: #79e4ce; font-weight: 600; }
#capture-window { position: relative; }
.capture-tools { position: absolute; z-index: 1; top: 8px; right: 20px; display: flex;
  align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 40px);
  gap: 3px; padding: 4px; border: 1px solid #35454a; border-radius: 10px; background: #101519f5; }
.capture-tools button { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 34px; padding: 4px 7px; color: #a7babd; background: transparent; border: 1px solid transparent;
  border-radius: 6px; white-space: nowrap; font-size: .78rem; }
.capture-tools button:hover { background: #243136; color: #ecf4f3; }
.capture-tools button:focus-visible { outline: 2px solid #79e4ce; outline-offset: 1px; }
.capture-tools button[aria-pressed="true"] { color: #79e4ce; background: #203d3b; border-color: #38605d; }
.capture-tools svg { flex: none; width: 17px; height: 17px; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#freeze[aria-pressed="false"] .resume-icon, #freeze[aria-pressed="true"] .freeze-icon { display: none; }
#plot { cursor: grab; touch-action: pan-y; display: block; width: 100%; height: clamp(300px, 57vh, 650px); }
#waterfall-panel { margin: 0 20px 16px 58px; }
#waterfall-label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; color: #a7babd; font-size: .82rem; }
.waterfall-scale { display: inline-flex; align-items: center; gap: 6px; }
.waterfall-scale i { display: inline-block; width: 66px; height: 7px; border-radius: 2px;
  background: linear-gradient(90deg, #141c2b, #265382, #11a9a4, #f1be61, #fff2d7); }
#waterfall { cursor: grab; touch-action: pan-y; display: block; width: 100%; height: clamp(120px, 22vh, 220px); background: #101519; image-rendering: pixelated; }
#plot.panning, #waterfall.panning { cursor: grabbing; }
progress { display: block; width: 100%; height: 5px; border: 0; accent-color: #66dec5; }
progress::-webkit-progress-bar { background: #26363b; }
progress::-webkit-progress-value { background: #66dec5; }
footer { margin-top: 14px; color: #a7babd; font-size: .9rem; }
</style>
<main>
  <header>
    <div><h1>B210 Spectrum</h1><p>70 MHz – 6 GHz</p></div>
    <div class="controls">
      <div class="gain-settings">
        <label id="gain-control" hidden>RX gain
          <input id="gain" type="range" min="0" max="76" step="1">
          <output id="gain-value" for="gain"></output>
        </label>
        <div id="gain-stages" hidden aria-label="Unified gain-table stages, nominal gain at 2.3 GHz"
             title="Stage indices and nominal gains from AD9361 UG-570. Actual gain varies with frequency.">
          <span>LNA <output for="gain"></output></span>
          <span>Mixer <output for="gain"></output></span>
          <span>TIA <output for="gain"></output></span>
          <span>LPF <output for="gain"></output></span>
          <span>Nominal at 2.3 GHz</span>
        </div>
      </div>
      <button id="tuning-window" type="button" disabled>56 MHz window</button>
      <button id="zoom-in" type="button" disabled>Zoom in</button>
      <button id="full-spectrum" type="button" disabled>Full spectrum</button>
    </div>
  </header>
  <section aria-label="Spectrum plot">
    <div class="bar"><span id="state" role="status">Connecting</span><span id="peak-key" hidden>Recent peaks</span><span id="reading">Power · dBFS</span></div>
    <progress id="progress" max="1" value="0" aria-label="Current sweep progress"></progress>
    <div id="capture-window">
      <div class="capture-tools" id="capture-tools" role="group" aria-label="Capture tools">
        <button id="peak-hold" type="button" aria-pressed="true" aria-label="Peak hold" title="Peak hold">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 19h18M4 16l4-3 4-4 3 4 5-3M10 5h5"/>
          </svg>
          <span>Peak hold</span>
        </button>
        <button id="freeze" type="button" aria-pressed="false" aria-label="Freeze trace" title="Freeze trace">
          <svg class="freeze-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14m6-14v14"/></svg>
          <svg class="resume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l10 7-10 7z"/></svg>
          <span id="freeze-label">Freeze</span>
        </button>
      </div>
      <canvas id="plot" role="img" aria-label="Received power in dBFS across 70 MHz to 6 GHz"></canvas>
    </div>
    <div id="waterfall-panel">
      <div id="waterfall-label">
        <span>Waterfall · newest at top</span>
        <span class="waterfall-scale"><span>−115</span><i aria-hidden="true"></i><span>−35 dBFS</span></span>
      </div>
      <canvas id="waterfall" width="1024" height="160" role="img"
              aria-label="History of received power across the frequencies shown in the spectrum plot"></canvas>
    </div>
  </section>
  <footer>
    <p id="detail">Each trace combines sequential receiver captures.</p>
    <p>Scroll to zoom · Drag to pan · Shift-drag to select a range</p>
  </footer>
</main>
<script>
const plot = document.querySelector('#plot');
const ctx = plot.getContext('2d');
const waterfall = document.querySelector('#waterfall');
const waterfallCtx = waterfall.getContext('2d');
const waterfallRow = waterfallCtx.createImageData(waterfall.width, 1);
const paletteCanvas = document.createElement('canvas');
paletteCanvas.width = 256;
paletteCanvas.height = 1;
const paletteCtx = paletteCanvas.getContext('2d');
const gradient = paletteCtx.createLinearGradient(0, 0, 256, 0);
['#141c2b', '#265382', '#11a9a4', '#f1be61', '#fff2d7'].forEach(
  (color, index, colors) => gradient.addColorStop(index / (colors.length - 1), color)
);
paletteCtx.fillStyle = gradient;
paletteCtx.fillRect(0, 0, 256, 1);
const waterfallColors = paletteCtx.getImageData(0, 0, 256, 1).data;
let waterfallKey, waterfallFrame;

const state = document.querySelector('#state');
const progress = document.querySelector('#progress');
const reading = document.querySelector('#reading');
const peakKey = document.querySelector('#peak-key');
const peakHold = document.querySelector('#peak-hold');
const detail = document.querySelector('#detail');
const freeze = document.querySelector('#freeze');
const freezeLabel = document.querySelector('#freeze-label');
const captureTools = document.querySelector('#capture-tools');
const zoomIn = document.querySelector('#zoom-in');
const tuningWindow = document.querySelector('#tuning-window');
const fullSpectrum = document.querySelector('#full-spectrum');
const gainControl = document.querySelector('#gain-control');
const gainSlider = document.querySelector('#gain');
const gainValue = document.querySelector('#gain-value');
const stageReadout = document.querySelector('#gain-stages');
const stageValues = stageReadout.querySelectorAll('output');
let gainStages = [];
let focusError = null, gainError = null;
let previewingGain = false, pendingGain = null;
let focusTimer, queuedFocus, sendingFocus = false;
const LEFT = 58, RIGHT_MARGIN = 20;
let latest, shown, frozen = false, cursor = null, view = null, drag = null;
const frequencyLabel = (hz, fine = false) => hz >= 1e9 && !fine
  ? (hz / 1e9).toFixed(3) + ' GHz'
  : (hz / 1e6).toFixed(fine ? 4 : 1) + ' MHz';

function fullRange() {
  return [70e6, 6e9];
}

function minimumSpan() {
  return shown?.levels
    ? 8 * (shown.high - shown.low) / shown.levels[0].length
    : 30000;
}

function sameRange(a, b) {
  return a === b || (a != null && b != null && a[0] === b[0] && a[1] === b[1]);
}

async function requestFocus(focus) {
  queuedFocus = focus;
  if (sendingFocus) return;
  sendingFocus = true;
  while (queuedFocus !== undefined) {
    const range = queuedFocus;
    queuedFocus = undefined;
    try {
      const response = await fetch('/api/focus', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(range)
      });
      if (!response.ok) throw new Error(response.status);
      focusError = null;
    } catch {
      focusError = 'Could not update the receiver sweep range.';
      render();
    }
  }
  sendingFocus = false;
}

function showView(low, high) {
  const [fullLow, fullHigh] = fullRange();
  const span = Math.min(fullHigh - fullLow, Math.max(high - low, minimumSpan()));
  low = Math.max(fullLow, Math.min((low + high - span) / 2, fullHigh - span));
  view = span === fullHigh - fullLow ? null : [low, low + span];
  fullSpectrum.disabled = view === null;
  draw();
}

function commitView(delay = 0) {
  clearTimeout(focusTimer);
  if (delay) focusTimer = setTimeout(() => requestFocus(view), delay);
  else requestFocus(view);
}

function setView(low, high, delay = 0) {
  cursor = null;
  showView(low, high);
  commitView(delay);
}

function drawWaterfall(values, low, high, dataLow, dataHigh) {
  if (!shown?.number || !values.length) return;
  const key = [low, high, dataLow, dataHigh, shown.gain].join('/');
  const {width, height} = waterfall;
  if (key !== waterfallKey || shown.number < waterfallFrame) {
    waterfallCtx.clearRect(0, 0, width, height);
    waterfallKey = key;
    waterfallFrame = undefined;
  }
  if (frozen || !sameRange(shown.capture_focus, view) || waterfallFrame === shown.number) return;

  const binsPerHz = values.length / (dataHigh - dataLow);
  const hzPerPixel = (high - low) / width;
  const rgba = waterfallRow.data;
  for (let column = 0; column < width; column++) {
    const edge = (low + column * hzPerPixel - dataLow) * binsPerHz;
    const first = Math.max(0, Math.floor(edge));
    const last = Math.min(values.length, Math.ceil(edge + hzPerPixel * binsPerHz));
    let power = -Infinity;
    for (let bin = first; bin < last; bin++) {
      if (Number.isFinite(values[bin])) power = Math.max(power, values[bin]);
    }
    const color = 4 * Math.round(255 * Math.max(0, Math.min(1, (power + 115) / 80)));
    const pixel = 4 * column;
    rgba[pixel] = waterfallColors[color];
    rgba[pixel + 1] = waterfallColors[color + 1];
    rgba[pixel + 2] = waterfallColors[color + 2];
    rgba[pixel + 3] = Number.isFinite(power) ? 255 : 0;
  }
  waterfallCtx.drawImage(waterfall, 0, 0, width, height - 1, 0, 1, width, height - 1);
  waterfallCtx.putImageData(waterfallRow, 0, 0);
  waterfallFrame = shown.number;
}

function draw() {
  const {width, height} = plot.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;
  plot.width = Math.round(width * scale);
  plot.height = Math.round(height * scale);
  ctx.scale(scale, scale);
  const left = LEFT, right = width - RIGHT_MARGIN, bottom = height - 34;
  const top = captureTools.offsetTop + captureTools.offsetHeight + 5;
  if (right <= left) return;
  const [fullLow, fullHigh] = fullRange();
  const [low, high] = view ?? [fullLow, fullHigh];
  const dataLow = shown?.low ?? fullLow;
  const dataHigh = shown?.high ?? fullHigh;
  const dataSpan = dataHigh - dataLow;
  const span = high - low;
  const fineLabels = span < 20e6;
  const level = view ? shown?.levels?.findIndex(values => values.length * span / dataSpan <= 4096) : -1;
  const values = level >= 0 ? shown.levels[level] : (shown?.trace || []);
  drawWaterfall(values, low, high, dataLow, dataHigh);
  const peaks = toolActive(peakHold) && level >= 0 ? shown.peakLevels?.[level] : null;
  peakKey.hidden = !peaks;
  const binWidth = dataSpan / values.length;
  const first = Math.max(0, Math.floor((low - dataLow) / binWidth) - 1);
  const last = Math.min(values.length, Math.ceil((high - dataLow) / binWidth) + 1);
  const x = fraction => left + fraction * (right - left);
  const y = power => bottom - (power + 120) / 120 * (bottom - top);
  function line(x1, y1, x2, y2, color) {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.font = '13px system-ui';
  ctx.fillStyle = '#a7babd';
  ctx.textAlign = 'right';
  for (let power = -120; power <= 0; power += 20) {
    line(left, y(power), right, y(power), '#304046');
    ctx.fillText(power, left - 9, y(power) + 4);
  }
  const divisions = width < 540 ? 2 : 4;
  tuningWindow.disabled = !values.length;
  zoomIn.disabled = !values.length || high - low <= minimumSpan() + 1;
  const ticks = view ? Array.from({length: divisions + 1}, (_, index) =>
    low + index * (high - low) / divisions
  ) : width < 540 ? [low, 2e9, 4e9, high] : [low, 1e9, 2e9, 3e9, 4e9, 5e9, high];
  for (const hz of ticks) {
    const px = x((hz - low) / (high - low));
    line(px, top, px, bottom, '#304046');
    ctx.textAlign = hz === low ? 'left' : hz === high ? 'right' : 'center';
    const label = view ? frequencyLabel(hz, fineLabels) : hz === low ? '70 MHz' : hz / 1e9 + ' GHz';
    ctx.fillText(label, px, bottom + 22);
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(left, top, right - left, bottom - top);
  ctx.clip();
  function drawTrace(data, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    let connected = false;
    for (let index = first; index < last; index++) {
      const power = data[index];
      if (!Number.isFinite(power)) { connected = false; continue; }
      const hz = dataLow + (index + 0.5) * binWidth;
      const px = x((hz - low) / (high - low));
      if (connected) ctx.lineTo(px, y(power));
      else ctx.moveTo(px, y(power));
      connected = true;
    }
    ctx.stroke();
  }
  if (peaks) drawTrace(peaks, '#f6b76baa');
  drawTrace(values, '#66dec5');
  ctx.restore();
  if (drag?.select) {
    ctx.fillStyle = '#66dec533';
    ctx.fillRect(Math.min(drag.start, drag.end), top, Math.abs(drag.end - drag.start), bottom - top);
  }
  const resolution = view && values.length
    ? ' · ' + (binWidth / 1000).toLocaleString(undefined, {maximumFractionDigits: 2}) + ' kHz/bin'
    : '';
  reading.textContent = 'Power · dBFS' + resolution;
  if (cursor !== null && cursor >= left && cursor <= right && values.length) {
    const fraction = (cursor - left) / (right - left);
    const hz = low + fraction * (high - low);
    const index = Math.min(Math.floor((hz - dataLow) / binWidth), values.length - 1);
    const power = hz >= dataLow && hz <= dataHigh ? values[index] : undefined;
    const readoutHz = Number.isFinite(power) ? dataLow + (index + 0.5) * binWidth : hz;
    line(cursor, top, cursor, bottom, '#c1d2d5');
    reading.textContent = frequencyLabel(readoutHz, fineLabels)
      + (Number.isFinite(power) ? ' · ' + power.toFixed(1) + ' dBFS' : ' · No data') + resolution;
  }
}

function toolActive(button) {
  return button.getAttribute('aria-pressed') === 'true';
}

function render() {
  if (!latest) return;
  const mode = latest.demo ? 'Demo' : latest.fpga ? 'B210 FPGA' : 'B210';
  const status = latest.error ? ' · Retrying' : frozen ? ' · Trace frozen'
    : latest.continuous ? ' · Continuous capture' : ' · Sweeping';
  if (state.textContent !== mode + status) state.textContent = mode + status;
  progress.value = latest.progress;
  const changed = !frozen && shown?.number !== latest.number;
  if (!frozen) shown = latest;
  gainControl.hidden = latest.requested_gain == null;
  if (pendingGain === latest.requested_gain) pendingGain = null;
  if (!previewingGain && pendingGain === null && latest.requested_gain != null) {
    gainSlider.value = latest.requested_gain;
    gainValue.value = latest.requested_gain + ' dB';
  }
  showGainStages();
  const focused = shown && (shown.low > fullRange()[0] || shown.high < fullRange()[1]);
  const sweep = shown?.number ? (focused ? 'Focused sweep' : 'Full sweep') + ' · '
    + shown.hops + ' hops · ' + shown.seconds + ' s per pass' : 'Waiting for the first sweep';
  const capture = shown?.continuous
    ? (shown.full_window ? 'Full 56 MHz window · DC and filter edges visible' : 'Fixed tuning')
      + ' · ' + (shown.rate_hz / 1e6) + ' MS/s · ' + shown.fft_size.toLocaleString() + '-point FFT · 8 averages' + (shown.gaps ? ' · RX gaps ' + shown.gaps : '')
    : sweep;
  const gainPending = pendingGain !== null || (!latest.demo && latest.gain != null
    && latest.gain !== Math.trunc(latest.requested_gain));
  const rangePending = latest.number && !frozen && !sameRange(latest.capture_focus, view);
  detail.textContent = latest.error || focusError || gainError
    || (gainPending ? 'Applying RX gain…' : rangePending ? 'Updating frequency range…' : capture);
  if (changed) draw();
}

peakHold.addEventListener('click', () => {
  peakHold.setAttribute('aria-pressed', !toolActive(peakHold));
  draw();
});

freeze.addEventListener('click', () => {
  frozen = !frozen;
  freeze.title = frozen ? 'Resume trace' : 'Freeze trace';
  freezeLabel.textContent = frozen ? 'Resume' : 'Freeze';
  freeze.setAttribute('aria-pressed', frozen);
  render();
});
tuningWindow.addEventListener('click', () => {
  const [low, high] = view ?? fullRange();
  const center = (low + high) / 2;
  setView(center - 28e6, center + 28e6);
});
zoomIn.addEventListener('click', () => {
  const [low, high] = view ?? fullRange();
  const quarter = (high - low) / 4;
  setView(low + quarter, high - quarter);
});
fullSpectrum.addEventListener('click', () => setView(...fullRange()));

function plotPoint(event, surface) {
  const bounds = surface.getBoundingClientRect();
  const left = surface === plot ? LEFT : 0;
  const width = bounds.width - (surface === plot ? LEFT + RIGHT_MARGIN : 0);
  return {fraction: (event.clientX - bounds.left - left) / width, width};
}

function limitFraction(fraction) {
  return Math.max(0, Math.min(1, fraction));
}

for (const surface of [plot, waterfall]) {
  surface.addEventListener('wheel', event => {
    if (!shown?.trace?.length || drag) return;
    const {fraction, width} = plotPoint(event, surface);
    if (fraction < 0 || fraction > 1) return;
    event.preventDefault();
    const [low, high] = view ?? fullRange();
    const span = high - low;
    if (Math.abs(event.deltaX) > Math.abs(event.deltaY) && !event.ctrlKey) {
      const shift = span * event.deltaX * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? width : 1) / width;
      setView(low + shift, high + shift, 120);
      return;
    }
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 120 : 1);
    const nextSpan = Math.max(minimumSpan(), Math.min(fullRange()[1] - fullRange()[0],
      span * Math.exp(Math.max(-2, Math.min(2, delta / 280)))));
    const anchor = low + fraction * span;
    setView(anchor - fraction * nextSpan, anchor + (1 - fraction) * nextSpan, 120);
  }, {passive: false});

  surface.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || !shown?.trace?.length || drag) return;
    const {fraction} = plotPoint(event, surface);
    if (fraction < 0 || fraction > 1) return;
    clearTimeout(focusTimer);
    const width = plot.getBoundingClientRect().width - LEFT - RIGHT_MARGIN;
    const position = LEFT + fraction * width;
    drag = {id: event.pointerId, fraction, start: position, end: position,
      range: view, select: event.shiftKey, moved: false};
    if (!drag.select) surface.classList.add('panning');
    surface.setPointerCapture(event.pointerId);
  });

  surface.addEventListener('pointermove', event => {
    if (!event.isPrimary) return;
    const {fraction, width} = plotPoint(event, surface);
    cursor = LEFT + fraction * (plot.getBoundingClientRect().width - LEFT - RIGHT_MARGIN);
    if (drag?.id === event.pointerId) {
      const offset = fraction - drag.fraction;
      drag.moved ||= Math.abs(offset * width) >= 4;
      if (drag.select) {
        drag.end = LEFT + limitFraction(fraction) * (plot.getBoundingClientRect().width - LEFT - RIGHT_MARGIN);
      } else if (drag.moved) {
        const [low, high] = drag.range ?? fullRange();
        const shift = -offset * (high - low);
        showView(low + shift, high + shift);
        return;
      }
    }
    draw();
  });

  surface.addEventListener('pointerup', event => {
    if (drag?.id !== event.pointerId) return;
    const {range, fraction, select, moved} = drag;
    drag = null;
    surface.classList.remove('panning');
    const point = plotPoint(event, surface);
    const [low, high] = range ?? fullRange();
    if (select && Math.abs((point.fraction - fraction) * point.width) >= 8) {
      const end = limitFraction(point.fraction);
      const hz = part => low + part * (high - low);
      setView(hz(Math.min(fraction, end)), hz(Math.max(fraction, end)));
      return;
    }
    if (!select && moved) {
      const shift = (fraction - point.fraction) * (high - low);
      setView(low + shift, high + shift);
      return;
    }
    commitView();
    draw();
  });

  surface.addEventListener('lostpointercapture', event => {
    if (drag?.id !== event.pointerId) return;
    view = drag.range;
    drag = null;
    surface.classList.remove('panning');
    fullSpectrum.disabled = view === null;
    commitView();
    draw();
  });
  surface.addEventListener('pointerleave', () => { cursor = null; draw(); });
}
new ResizeObserver(draw).observe(plot);

function groupPeaks(values, size) {
  const grouped = new Float32Array(values.length / size);
  for (let i = 0; i < grouped.length; i++) {
    let peak = -Infinity;
    for (let j = 0; j < size; j++) peak = Math.max(peak, values[i * size + j]);
    grouped[i] = peak;
  }
  return grouped;
}

function zoomLevels(level) {
  const levels = [level];
  while (level.length > 4096 && level.length % 2 === 0) {
    level = groupPeaks(level, 2);
    levels.push(level);
  }
  return levels;
}

function showGainStages() {
  const gain = previewingGain ? Number(gainSlider.value) : pendingGain ?? latest?.requested_gain;
  const values = gainStages[Math.trunc(gain)];
  stageReadout.hidden = !values;
  if (!values) return;
  const [lna, mixer, tia, lpf] = values;
  // AD9361 UG-570, tables 27–30. LNA and mixer gain vary with frequency.
  const nominal = [[3, 14, 17, 21][lna], mixer < 3 ? [0, 3, 9][mixer] : mixer + 11,
    [-6, 0][tia], lpf];
  stageValues.forEach((output, index) => {
    const text = values[index] + ' (' + nominal[index] + ' dB)';
    if (output.value !== text) output.value = text;
  });
}

async function loadGainStages() {
  try {
    const response = await fetch('/api/gain-stages');
    if (!response.ok) return;
    gainStages = await response.json();
    showGainStages();
  } catch {
    // Gain control remains available if the optional breakdown cannot be loaded.
  }
}
loadGainStages();

gainSlider.addEventListener('input', () => {
  previewingGain = true;
  gainValue.value = gainSlider.value + ' dB';
  showGainStages();
});
gainSlider.addEventListener('change', async () => {
  previewingGain = false;
  pendingGain = Number(gainSlider.value);
  gainError = null;
  gainSlider.disabled = true;
  render();
  try {
    const response = await fetch('/api/gain', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(pendingGain)
    });
    if (!response.ok) throw new Error(response.status);
  } catch {
    pendingGain = null;
    gainError = 'Could not change RX gain';
  } finally {
    gainSlider.disabled = false;
    render();
  }
});

async function poll() {
  try {
    const response = await fetch('/api/sweep');
    if (!response.ok) throw new Error(response.status);
    const frame = await response.json();
    if (!latest && frame.focus) {
      view = frame.focus;
      fullSpectrum.disabled = false;
    }
    if (frame.number && frame.number !== latest?.number) {
      const detailResponse = await fetch('/api/detail/' + frame.number + (frame.peaks ? '?peaks=1' : ''));
      if (detailResponse.status === 404) return; // A newer sweep replaced this one.
      if (!detailResponse.ok) throw new Error(detailResponse.status);
      const data = new Float32Array(await detailResponse.arrayBuffer());
      const rawLength = frame.detail_count ?? frame.trace.length * 384;
      frame.levels = zoomLevels(data.subarray(0, rawLength));
      if (frame.peaks) frame.peakLevels = zoomLevels(data.subarray(rawLength));
    } else {
      frame.levels = latest?.levels;
      frame.peakLevels = latest?.peakLevels;
    }
    latest = frame;
    render();
  } catch {
    state.textContent = 'Disconnected · Retrying';
  } finally {
    const interval = view && !frozen ? Math.max(40, Math.min(350, (latest?.seconds || 0.08) * 500)) : 350;
    setTimeout(poll, interval);
  }
}
poll();
</script>
